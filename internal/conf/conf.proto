
syntax = "proto3";
package kratos.api;

option go_package = "skyflow_backend/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Persistence persistence = 3;
  MessageQueue message_queue = 4;
  MessageQueue delay_message_queue = 5;
  API api = 6;
  Dispatcher dispatcher = 7;
  Exporter exporter = 8;
  Resource resource = 9;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    string driver = 1;
    string source = 2;
  }
  message Redis {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
  }
  Database database = 1;
  Redis redis = 2;
}

message Persistence {
  string dsn = 1;
  int32 max_idle_conns = 2;
  int32 max_open_conns = 3;
  string log_level = 4;
  google.protobuf.Duration max_idle_time = 5;
}

message MessageQueue {
  string dsn = 1;
}

message API {
  int32 qps_limit = 1;
}

message Dispatcher {
  int32 max_concurrency = 1;
  int32 max_queue_size = 2;
}

message Exporter {
  repeated string listeners = 1;
}

message Resource {
  string memory_request = 1;
  int32 cpu_request = 2;
  int32 rate = 3;
}
